name: CodeSheriff Security Pipeline

# Run on pushes to any branch and on PRs targeting main.
on:
  push:
  pull_request:
    branches: [ main ]

# Cancel a previous in-progress run on the same ref when a new commit lands — saves minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. SECRETS (full git history) ─────────────────────────────────────────
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history → Gitleaks scans EVERY commit, not just HEAD
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action exits non-zero on any leak → this job (and the run) fails. Good.
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified   # fail only on verified live creds (less noise in CI)

  # ── 2. SAST (Semgrep + Bandit) — run the REAL sast-scanner image ───────────
  #   Dogfooding: same binary + same bundled rules as the live scanner (no pip-install copy).
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the real sast-scanner image
        run: docker compose build sast-scanner   # the exact image the live stack runs
      - name: Semgrep (image's bundled rules)
        run: |
          docker run --rm -v "$PWD":/src:ro devsecops-skeleton-sast-scanner \
            semgrep --config /app/rules/python-security.yml --error --quiet /src
        #          ^ rules live INSIDE the image at /app/rules (House Rule #3); --error: exit 1 on a finding
      - name: Bandit (high severity gates the build)
        run: |
          docker run --rm -v "$PWD":/src:ro devsecops-skeleton-sast-scanner \
            bandit -r /src -lll -x /src/.venv,/src/tests
        #          ^ -lll = HIGH only; non-zero exit fails the job

  # ── 3. IaC (Checkov) — run the REAL infra-scanner image ───────────────────
  #   Same Checkov version the live scanner ships; skip-list + scope live in .checkov.yaml (Concern #5).
  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the real infra-scanner image
        run: docker compose build infra-scanner
      - name: Checkov (scoped + justified skips from .checkov.yaml)
        run: |
          docker run --rm -v "$PWD":/src:ro devsecops-skeleton-infra-scanner \
            checkov -d /src --quiet --compact --config-file /src/.checkov.yaml
        #   -d: scan a directory. soft_fail defaults to FALSE → a real finding fails the job (the gate).
        #   What we consciously accept (root in infra-scanner, etc.) is justified in .checkov.yaml.

  # ── 4. BUILD images (needs the code to be clean-ish first is optional;
  #       here we build in parallel, then scan) ────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build           # builds every service per docker-compose.yml

  # ── 5. IMAGE CVE scan (Trivy) — fail on CRITICAL ──────────────────────────
  image-scan:
    runs-on: ubuntu-latest
    needs: build                            # only after images exist
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build sast-scanner   # rebuild one image to scan (runner is fresh)
      - name: Trivy (CRITICAL blocks merge)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-skeleton-sast-scanner   # match your image name (docker images)
          severity: CRITICAL
          exit-code: "1"                    # 1 = fail the job if any CRITICAL CVE is found
          ignore-unfixed: true              # don't block on CVEs with no available fix

  # ── 6. DEPLOY + DAST (only if everything above passed) ────────────────────
  deploy-dast:
    runs-on: ubuntu-latest
    needs: [ secrets, sast, iac, image-scan ]   # the gate: all must pass
    steps:
      - uses: actions/checkout@v4
      - name: Bring the stack up
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker compose up -d
          # wait for the webhook to answer health before scanning
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 5
          done
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8000      # scan a service exposed on the runner
          fail_action: false                 # report, don't hard-fail the build on warnings
      - name: Tear down
        if: always()                         # run even if a previous step failed
        run: docker compose down -v

  # ── 7. PR SUMMARY comment ─────────────────────────────────────────────────
  pr-comment:
    runs-on: ubuntu-latest
    needs: [ secrets, sast, iac, image-scan ]
    if: github.event_name == 'pull_request'  # only on PRs (there's a PR to comment on)
    permissions:
      pull-requests: write                   # let GITHUB_TOKEN post a comment
    steps:
      - name: Post pipeline summary
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🛡️ CodeSheriff pipeline complete
            | Stage | Result |
            |-------|--------|
            | Secrets | ${{ needs.secrets.result }} |
            | SAST | ${{ needs.sast.result }} |
            | IaC | ${{ needs.iac.result }} |
            | Image CVEs | ${{ needs.image-scan.result }} |
            `;
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });