services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  webhook-receiver:
    build: ./webhook-receiver
    env_file: ./webhook-receiver/.env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  scan-orchestrator:
    build: ./scan-orchestrator
    env_file: ./scan-orchestrator/.env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
  sast-scanner:
    build: ./sast-scanner
    env_file: ./sast-scanner/.env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8002:8002"
    depends_on:
      rabbitmq:
        condition: service_healthy
  secrets-scanner:
    build: ./secrets-scanner
    env_file: ./secrets-scanner/.env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8003:8003"
    depends_on:
      rabbitmq:
        condition: service_healthy
