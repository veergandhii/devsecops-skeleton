rules:
  # ─────────────────────────────────────────────
  # RULE 1: Hardcoded password / secret in variable assignment
  # WHY: Devs sometimes hardcode creds directly in source; these end up in Git history.
  # DETECTS: password = "abc123", api_key = "sk-xyz"
  # OSS COMPATIBLE: Yes — pure pattern match, no cloud lookup needed
  # ─────────────────────────────────────────────
  - id: hardcoded-password
    patterns:
      - pattern: $VAR = "$STR"
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|pwd|secret|api_key|apikey|token|auth_token|access_token|private_key)
    message: >
      Hardcoded secret found in variable '$VAR'. Never store credentials in source code.
      Use environment variables or a secrets manager (e.g. AWS Secrets Manager, HashiCorp Vault).
    languages: [python]
    severity: ERROR

  # ─────────────────────────────────────────────
  # RULE 2: Pickle deserialization
  # WHY: pickle.loads() on untrusted data allows arbitrary code execution.
  # DETECTS: pickle.loads(data), pickle.load(file)
  # OSS COMPATIBLE: Yes
  # ─────────────────────────────────────────────
  - id: pickle-deserialization
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
    message: >
      Unsafe deserialization via pickle. Unpickling untrusted data executes arbitrary Python code.
      Use JSON or a schema-validated format (e.g. protobuf, msgpack with validation) instead.
    languages: [python]
    severity: ERROR

  # ─────────────────────────────────────────────
  # RULE 3: subprocess with shell=True
  # WHY: shell=True passes the command through /bin/sh — if any part is user-controlled
  #      you have a shell injection vulnerability.
  # DETECTS: subprocess.call("rm -rf /", shell=True), subprocess.run(cmd, shell=True)
  # OSS COMPATIBLE: Yes
  # ─────────────────────────────────────────────
  - id: subprocess-shell-true
    pattern-either:
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)
    message: >
      subprocess called with shell=True. If any argument contains user input this is a
      shell injection vulnerability. Use a list of arguments instead:
      subprocess.run(['ls', '-la']) not subprocess.run('ls -la', shell=True).
    languages: [python]
    severity: ERROR

  # ─────────────────────────────────────────────
  # RULE 4: eval() on any input
  # WHY: eval() executes arbitrary Python. If the string comes from a user or network
  #      this is remote code execution.
  # DETECTS: eval(user_input), eval(request.json())
  # OSS COMPATIBLE: Yes
  # ─────────────────────────────────────────────
  - id: dangerous-eval
    pattern-either:
      - pattern: eval($X)
      - pattern: exec($X)
    message: >
      eval()/exec() executes arbitrary Python code. If '$X' contains user-controlled data
      this is Remote Code Execution (RCE). Use ast.literal_eval() for safe expression parsing,
      or restructure logic to avoid dynamic evaluation entirely.
    languages: [python]
    severity: ERROR

  # ─────────────────────────────────────────────
  # RULE 5: SQL injection via string formatting
  # WHY: Building SQL with f-strings or % formatting allows attackers to break out of
  #      the query and run arbitrary SQL (SQLi).
  # DETECTS: cursor.execute(f"SELECT * FROM users WHERE id={user_id}")
  # OSS COMPATIBLE: Yes
  # ─────────────────────────────────────────────
  - id: sql-injection-string-format
    pattern-either:
      - pattern: $CURSOR.execute(f"..." % ...)
      - pattern: $CURSOR.execute("..." % $VAR)
      - pattern: $CURSOR.execute("..." + $VAR)
      - pattern: $CURSOR.execute(f"...{$VAR}...")
    message: >
      Possible SQL injection: query built with string formatting or concatenation.
      Use parameterised queries: cursor.execute("SELECT * FROM users WHERE id = %s", (user_id,))
      The database driver escapes values safely; string formatting does not.
    languages: [python]
    severity: ERROR

  # ─────────────────────────────────────────────
  # RULE 6: Hardcoded IP address
  # WHY: Hardcoded IPs are an ops/security smell — they break environments and
  #      can expose internal network topology if code leaks.
  # DETECTS: host = "192.168.1.1", url = "http://10.0.0.5:8080"
  # OSS COMPATIBLE: Yes
  # ─────────────────────────────────────────────
  - id: hardcoded-ip-address
    patterns:
      - pattern: $VAR = "$IP"
      - metavariable-regex:
          metavariable: $IP
          # metavariable-regex is anchored (re.match), so .* lets it find an
          # IP anywhere in the string (e.g. inside a URL), not just at the start.
          regex: .*\b(?:\d{1,3}\.){3}\d{1,3}\b
    message: >
      Hardcoded IP address '$IP' found. Use environment variables or service discovery
      so the address can change per environment without a code change.
    languages: [python]
    severity: WARNING

  # ─────────────────────────────────────────────
  # RULE 7: Weak hash algorithms (MD5 / SHA1)
  # WHY: MD5 and SHA1 are cryptographically broken for security use.
  #      Collisions are practical; they must not be used for passwords or integrity checks.
  # DETECTS: hashlib.md5(data), hashlib.sha1(data)
  # OSS COMPATIBLE: Yes
  # ─────────────────────────────────────────────
  - id: weak-hash-algorithm
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
      - pattern: hashlib.new("md5", ...)
      - pattern: hashlib.new("sha1", ...)
    message: >
      Weak hash algorithm detected. MD5 and SHA1 are cryptographically broken.
      For integrity checking use SHA-256+. For passwords use bcrypt, argon2, or scrypt —
      never a raw hash function regardless of strength.
    languages: [python]
    severity: WARNING

  # ─────────────────────────────────────────────
  # RULE 8: Insecure random number generation
  # WHY: random module is not cryptographically secure. Predictable sequences
  #      break token generation, session IDs, OTPs.
  # DETECTS: random.random(), random.randint(), random.choice() for security use
  # OSS COMPATIBLE: Yes
  # ─────────────────────────────────────────────
  - id: insecure-random
    pattern-either:
      - pattern: random.random()
      - pattern: random.randint(...)
      - pattern: random.choice(...)
      - pattern: random.randrange(...)
      - pattern: random.shuffle(...)
    message: >
      random module is not cryptographically secure. For tokens, session IDs, OTPs, or
      any security-sensitive value use: secrets.token_hex(), secrets.token_urlsafe(),
      or secrets.choice(). The secrets module is designed exactly for this.
    languages: [python]
    severity: WARNING

  # ─────────────────────────────────────────────
  # RULE 9: assert used for security checks
  # WHY: assert statements are stripped out when Python runs with -O (optimise flag).
  #      Any security check done with assert is silently bypassed in production.
  # DETECTS: assert user.is_admin(), assert token == expected
  # OSS COMPATIBLE: Yes
  # ─────────────────────────────────────────────
  - id: assert-used-for-auth
    patterns:
      - pattern: assert $EXPR
      - metavariable-regex:
          metavariable: $EXPR
          # anchored (re.match): $EXPR is like "user.is_admin()", so the keyword
          # is not at position 0 — .* lets the regex find it anywhere.
          regex: (?i).*(is_admin|is_authenticated|has_perm|authorized|auth|token|role|permission)
    message: >
      assert used for a security/auth check. Python strips assert statements when run with
      -O (optimise). Use explicit if/raise: if not user.is_admin(): raise PermissionError(...)
    languages: [python]
    severity: ERROR

  # ─────────────────────────────────────────────
  # RULE 10: Binding to 0.0.0.0 explicitly in code
  # WHY: Services bound to 0.0.0.0 are reachable on all interfaces including public ones.
  #      This should be a deployment concern, not hardcoded in application logic.
  # DETECTS: app.run(host="0.0.0.0"), uvicorn.run(app, host="0.0.0.0")
  # OSS COMPATIBLE: Yes
  # ─────────────────────────────────────────────
  - id: bind-all-interfaces
    pattern-either:
      - pattern: $APP.run(..., host="0.0.0.0", ...)
      - pattern: uvicorn.run(..., host="0.0.0.0", ...)
      - pattern: $SERVER.bind("0.0.0.0", ...)
    message: >
      Service hardcoded to bind on 0.0.0.0 (all interfaces). This exposes the service
      on every network interface including public ones. Control binding via environment
      variable or deployment config, not hardcoded application logic.
    languages: [python]
    severity: WARNING

  # ─────────────────────────────────────────────
  # RULE 11: XML External Entity (XXE) via lxml or xml.etree
  # WHY: Default XML parsers process external entities. An attacker can read local files
  #      or trigger SSRF by crafting a malicious XML payload.
  # DETECTS: etree.fromstring(data), etree.parse(file) without safe parser
  # OSS COMPATIBLE: Yes
  # ─────────────────────────────────────────────
  - id: xxe-via-xml-parse
    pattern-either:
      - pattern: xml.etree.ElementTree.parse(...)
      - pattern: xml.etree.ElementTree.fromstring(...)
      - pattern: lxml.etree.fromstring(...)
      - pattern: lxml.etree.parse(...)
    message: >
      Default XML parsers may be vulnerable to XXE (XML External Entity) attacks.
      For lxml use: parser = lxml.etree.XMLParser(resolve_entities=False) then parse with it.
      For ElementTree use defusedxml library which disables all dangerous XML features.
    languages: [python]
    severity: WARNING

  # ─────────────────────────────────────────────
  # RULE 12: Flask debug mode enabled
  # WHY: Flask debug=True enables the Werkzeug interactive debugger which allows
  #      arbitrary code execution via the browser. Fatal if reachable externally.
  # DETECTS: app.run(debug=True)
  # OSS COMPATIBLE: Yes
  # ─────────────────────────────────────────────
  - id: flask-debug-mode
    pattern: $APP.run(..., debug=True, ...)
    message: >
      Flask running with debug=True. The Werkzeug debugger allows arbitrary Python execution
      via the browser debugger PIN. Never enable debug mode in production.
      Use FLASK_ENV=production or remove debug=True and control via environment.
    languages: [python]
    severity: ERROR

  # ─────────────────────────────────────────────
  # RULE 13: Insecure use of yaml.load (without Loader)
  # WHY: yaml.load() with untrusted input allows arbitrary object construction
  #      and code execution via Python-specific YAML tags.
  # DETECTS: yaml.load(data) — missing Loader= argument
  # OSS COMPATIBLE: Yes
  # ─────────────────────────────────────────────
  - id: yaml-load-unsafe
    pattern: yaml.load($DATA)
    message: >
      yaml.load() without a Loader is unsafe and executes arbitrary Python via YAML tags.
      Use yaml.safe_load() for untrusted input, or yaml.load(data, Loader=yaml.SafeLoader).
      yaml.safe_load() only handles standard YAML types (str, int, list, dict).
    languages: [python]
    severity: ERROR